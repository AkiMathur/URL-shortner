name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest -v
        env:
          SECRET_KEY: ci-test-secret
          ALGORITHM: HS256
          # SQLite URL: skips the postgres-only database_exists() check in database.py
          # conftest.py overrides the engine/session anyway, so no real DB is used
          DATABASE_URL: sqlite://

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t url-shortener .